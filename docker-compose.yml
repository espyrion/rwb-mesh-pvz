services:
  api:
    build: ./api
    container_name: mesh-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:////data/mesh.db
      ECON_PARAMS: /app/economics/params.yaml
      PYTHONPATH: /app
      TZ: Europe/Moscow
      MESH_PVZ_KEY: ${MESH_PVZ_KEY:-demo-pvz-key}
      MESH_SELLER_KEY: ${MESH_SELLER_KEY:-demo-seller-key}
      MESH_ADMIN_KEY: ${MESH_ADMIN_KEY:-demo-admin-key}
    volumes:
      - ./api:/app
      - ./economics:/app/economics
      - meshdata:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
  web:
    build: ./web
    container_name: mesh-web
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_started
volumes:
  meshdata:
