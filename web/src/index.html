<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mesh-ПВЗ · рабочее место ПВЗ и продавца</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">M</div>
      <div>
        <strong>Mesh-ПВЗ</strong>
        <span>MVP хакатона RWB</span>
      </div>
    </div>
    <nav id="nav">
      <button class="nav-item active" data-page="dashboard">Дашборд</button>
      <button class="nav-item" data-page="pvz">Кабинет ПВЗ</button>
      <button class="nav-item" data-page="seller">Кабинет продавца</button>
      <button class="nav-item" data-page="orders">Заказы</button>
      <button class="nav-item" data-page="routes">Маршруты</button>
      <button class="nav-item" data-page="incidents">Инциденты</button>
      <button class="nav-item" data-page="clock">Время и уведомления</button>
    </nav>
    <div class="sidebar-footer">
      <div id="clock-badge" class="badge">—</div>
      <p class="muted small">Хаб, магистраль и платёжный шлюз — имитация. Денежные расчёты программные, реальные платежи не проводятся.</p>
    </div>
  </aside>

  <main>
    <header class="topbar">
      <div>
        <h1 id="page-title">Дашборд</h1>
        <p id="page-subtitle" class="muted">Сводка по сети ПВЗ и денежным потокам</p>
      </div>
      <div class="topbar-actions">
        <span id="env-badge" class="badge badge-warn">ИМИТАЦИЯ ЛОГИСТИКИ</span>
        <button id="refresh" class="btn ghost">Обновить</button>
      </div>
    </header>

    <section id="page" class="page"></section>
  </main>

  <div id="toast" class="toast" hidden></div>
  <script src="app.js"></script>
</body>
</html>
