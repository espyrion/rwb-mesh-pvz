<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mesh-ПВЗ · кабинеты покупателя, продавца, ПВЗ и маркетплейса</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-role="buyer">
  <a class="skip-link" href="#page">Перейти к содержимому</a>
  <header class="topbar">
    <div class="brand">
      <div class="logo">M</div>
      <div><strong>Mesh-ПВЗ</strong><span>MVP хакатона RWB</span></div>
    </div>
    <div class="role-switch" id="role-switch" role="tablist" aria-label="Кабинет">
      <button class="role-btn" role="tab" data-role="buyer">Покупатель</button>
      <button class="role-btn" role="tab" data-role="seller">Продавец</button>
      <button class="role-btn" role="tab" data-role="pvz">ПВЗ</button>
      <button class="role-btn" role="tab" data-role="admin">Маркетплейс</button>
    </div>
    <div class="topbar-actions">
      <span id="clock-badge" class="badge badge-quiet">—</span>
      <button id="demo-quick" class="btn ghost small" data-quick="demo" title="Быстрый переход в демо-кокпит">Демо-кокпит</button>
      <button id="refresh" class="btn ghost small">Обновить</button>
    </div>
  </header>

  <!-- Операторская навигация: только в кабинете «Маркетплейс» -->
  <nav id="nav" class="subnav" aria-label="Разделы маркетплейса" hidden>
    <button class="nav-item" data-page="dashboard">Дашборд</button>
    <button class="nav-item" data-page="routing">Как выбирается маршрут</button>
    <button class="nav-item" data-page="map">Карта сети</button>
    <button class="nav-item" data-page="economics">Экономика</button>
    <button class="nav-item" data-page="ledger">Журнал проводок</button>
    <button class="nav-item" data-page="incidents">Инциденты</button>
    <button class="nav-item" data-page="demo">Демо-кокпит</button>
  </nav>

  <main>
    <div class="pagehead">
      <div>
        <span id="role-badge" class="role-badge">Покупатель</span>
        <h1 id="page-title" tabindex="-1">Покупатель</h1>
        <p id="page-subtitle" class="muted">Оформление и отслеживание заказов</p>
      </div>
      <span id="env-badge" class="badge badge-quiet" title="Хаб, магистраль и платёжный шлюз — заглушки; реальные перевозки и платежи не выполняются">имитация логистики</span>
    </div>
    <section id="page" class="page" tabindex="-1"></section>
  </main>

  <!-- Live-регион для сообщений: не hidden, иначе скринридер не объявит текст; скрыт визуально классом. -->
  <div id="toast" class="toast is-hidden" role="status" aria-live="polite" aria-atomic="true"></div>
  <script src="cabinets.js"></script>
  <script src="app.js"></script>
  <script src="map.js"></script>
</body>
</html>
